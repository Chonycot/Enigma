<!DOCTYPE html>
<html lang="en" culture="ru-RU">

<head>
    <base>
    <title>Creatio</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="fontiran.com:license" content="LAXSN">
    <link rel="stylesheet" href="css\bar.min.css">
    <link rel="stylesheet" href="css\group_servise.min.css">
    <link rel="stylesheet" href="css\head.min.css">
    <link rel="stylesheet" href="css\main.min.css">
    <link rel="stylesheet" href="css\styles.min.css">

</head>

<body id="creatio">
    <section id="tehnic_bar">
        <h3 id="tehnic_heading">Тех.поддержка</h3>
        <hr>
        <ul>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\servise_catalog.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">Сервисный каталог
                            портала</a></button>
                </div>
            </li>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\window.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">Единое окно</a></button>
                </div>
            </li>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\documents.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">Контрагенты</a></button>
                </div>
            </li>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\contacts.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">Контакты</a></button>
                </div>
            </li>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\obraschenie.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">Обращения</a></button>
                </div>
            </li>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\narady.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">Наряды</a></button>
                </div>
            </li>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\active.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">Активности</a></button>
                </div>
            </li>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\base znany.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">База знаний</a></button>
                </div>
            </li>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\type.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">Типы запросов</a></button>
                </div>
            </li>
            <li class="tehnic_bar_spis">
                <div class="tehnic_bar_spis_osn"><img class="tehnic_bar_img" src="assets\problem.png" alt="">
                    <button class="tehnic_bar_button"><a class="link" href="404.html">Проблемы</a></button>
                </div>
            </li>
        </ul>
    </section>
    <div id="main">
        <section id="main_head">
            <div id="main_head_1">
                <div>
                    <input type="text" placeholder="Что я могу для вас сделать?" name="search_obsh"
                        style="width: 180px;">
                </div>
                <img id="logo" src="assets/logo.png" alt="">
                <p style="font-size: 10px;">7.15.4.3055</p>
            </div>
        </section>
        <section>
            <h1 style="font-size: 25px; color: #0c0482;">Каталог сервисов</h1>
            <div style="display: flex; flex-direction: row; gap: 5px;">
                <input type="search" style="width: 600px; height: 25px;" placeholder="Введите необходимый сервис">
                <button class="search_button">
                    <a href="/">
                        <img src="assets\problem.png" alt="" class="search_button_img">
                    </a>
                </button>
            </div>
        </section>
        <section>
            <div>
                <ul id="mainBar1">
                    <li><button class="mainBar1_button">Все сервисы</button></li>
                    <li><button class="mainBar1_button">АС ДОМ.РФ</button></li>
                    <li><button class="mainBar1_button">Поддержка рабочих мест</button></li>
                    <li><button class="mainBar1_button">АХО</button></li>
                    <li><button class="mainBar1_button">Доступы</button></li>
                    <li><button class="mainBar1_button">АС Банк ДОМ.РФ</button></li>
                    <li><button class="mainBar1_button">Избранное</button></li>
                </ul>
            </div>
        </section>
        <hr style="width: 100%;">
        <section>
            <h2>Список групп сервисов</h2>
            <div class="mainBody">
                <button class="mainBody_button" id="btn1">
                    Программное обеспечение
                    <div id="count1" style="align-self: flex-end; padding-bottom: 15px;">0</div>
                </button>
                <button class="mainBody_button" id="btn2">
                    Доступы
                    <div id="count2" style="align-self: flex-end; padding-bottom: 15px;">0</div>
                </button>
                <button class="mainBody_button" id="btn3">
                    Поддержка рабочих мест
                    <div id="count3" style="align-self: flex-end; padding-bottom: 15px;">0</div>
                </button>
                <button class="mainBody_button" id="btn4">
                    Ресурсы CI/CD Платформы
                    <div id="count4" style="align-self: flex-end; padding-bottom: 15px;">0</div>
                </button>
                <button class="mainBody_button" id="btn5">
                    АС ДОМ.РФ
                    <div id="count5" style="align-self: flex-end; padding-bottom: 15px;">0</div>
                </button>
                <button class="mainBody_button" id="btn6">
                    Новый ДО
                    <div id="count6" style="align-self: flex-end; padding-bottom: 15px;">0</div>
                </button>
                <button class="mainBody_button" id="btn7">
                    АС Банк ДОМ.РФ
                    <div id="count7" style="align-self: flex-end; padding-bottom: 15px;">0</div>
                </button>
                <button class="mainBody_button" id="btn8">
                    АХО
                    <div id="count8" style="align-self: flex-end; padding-bottom: 15px;">0</div>
                </button>
            </div>
        </section>
        <div id="modalForm" class="modal">
            <div class="modal-content">
                <h2>Создание заявки</h2>
                <form id="requestForm">
                    <label for="topic">Тема:</label>
                    <input type="text" id="topic" name="topic" required>

                    <label for="description">Описание:</label>
                    <textarea id="description" name="description" required></textarea>

                    <button type="submit">Отправить</button>
                </form>
            </div>
        </div>
    </div>
    <script src="scripts\scripts.js"></script>
</body>

</html>
